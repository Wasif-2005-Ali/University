<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <h2>Stack Visualizer (LIFO)</h2>
    <p>Click a number to PUSH it to the stack:</p>

    <div class="input-values">
        <button class="push-btn">10</button>
        <button class="push-btn">20</button>
        <button class="push-btn">30</button>
        <button class="push-btn">40</button>
    </div>

    <p>Click the top item in the stack to POP it:</p>


    <div id="stack-container">

    </div>

    <script src="script.js"></script>
</body>

</html>
